[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stdio-fixer"
version = "0.1.0"
description = "Offline read-only diagnostics for MCP stdio framing and startup configuration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
mcp-stdio-fixer = "mcp_stdio_fixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
